[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parakeet-tdt-onnx"
version = "0.1.0"
description = "Run NVIDIA parakeet-tdt-0.6b-v3 (multilingual FastConformer-TDT) on ONNX Runtime - self-contained, CPU-first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "onnxruntime>=1.17",
    "numpy>=1.24",
]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.20"]
soundfile = ["soundfile>=0.12"]

[project.scripts]
parakeet-tdt-onnx = "parakeet_tdt_onnx.cli:main"

[tool.setuptools.packages.find]
include = ["parakeet_tdt_onnx*"]
